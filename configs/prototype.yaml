# Prototype: Qwen3.5-4B (post-trained chat) attacker vs 3x suggestible WM.
# Values below are the TUNED set that trains (see AGENT_GUIDE.md / NOTES.md);
# they match the box config that produced runs/proto/best.
# Fits a single H100 80GB.

# ---- 模型 ----
actor:
  model_name: /path/to/sft-merged    # the MERGED SFT model (NOT the raw base) — see AGENT_GUIDE §2/§7
  thinking: false
  max_new_tokens: 64
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

critic:
  # Small separate critic for the prototype (full finetune -> keep it small).
  model_name: Qwen/Qwen2.5-1.5B
  fp32: true    # fp32 = stable for <=1.5B (bf16 NaNs); set false for a ~4B bf16 critic

world_model:
  model_name: /path/to/models/qwen35-suggestible-wm    # uploaded from opd-mm3/
  max_new_tokens: 200      # benign emit full "Message: ...\nPosition: <int>"

real_eval:
  model_name: /path/to/models/qwen35-suggestible-wm    # unused when reuse below
  max_new_tokens: 200

# ---- Game (matches RL_attack_env_qwen.py) ----
game:
  max_pos: 20
  n_benign: 3
  max_steps: 10            # env default
  consensus_tol: 0         # benign consensus <=> (max-min) <= tol (0 = exact)
  benign_personality: suggestible   # all 3 benign use the suggestible suffix
  msg_order: index         # attacker message listed last
  init: random
  seed: 0

# ---- Reward (§4) ----
reward:
  alpha_spread: 0.3
  eta_early_fail: 0.1
  invalid_penalty: -0.05
  beta_fluency: 0.2          # TUNED anti-gibberish penalty scale (0 = off)
  fluency_threshold: -4.0    # per-token base log-prob floor; below this = penalized
  xi_uncertainty: 0.0
  beta_cf: 0.0
  phi_w_range: 0.7
  phi_w_pair: 0.3

# ---- GAE (§5) ----
gae:
  gamma: 0.99
  lam_actor: 0.90
  lam_critic: 0.95         # TUNED (was 1.0; pure MC too high-variance for critic)

# ---- PPO (§6, §7) ----
ppo:
  clip_eps: 0.2            # calibrate via preflight §10.E / turn_clip_frac (5-15%)
  group_size_G: 1
  epochs: 1
  grad_norm: 1.0
  batch_episodes_N: 8      # small for a prototype
  minibatch_turns: 4       # update-forward batch (memory only). 4 fits fp32-1.5B
                           # critic + 4B actor + entropy term; drop to 2 if OOM.
  w_next_position: 0.1
  w_message: 0.9

# ---- LR (§6.3) ----
lr:
  actor: 1.0e-5            # TUNED (was 1e-6; too low froze the policy under grad clip)
  critic: 3.0e-6          # TUNED (was 1e-5; too high diverged the critic)
  schedule: constant
  warmup_steps: 20

# ---- Trust region (§7) ----
trust_region:
  target_kl: 0.015
  hard_stop_kl: 0.03
  hard_stop_clipfrac: 0.35
  beta_kl_ref: 1.0e-2      # TUNED — anchors to the SFT model, holds fluency (5e-3 if over-constrained)
  ent_coef: 0.003          # TUNED entropy bonus (0.01 ran entropy away)
  target_ref_kl: [0.01, 0.03]

# ---- Critic warmup (§7.1) ----
critic_warmup:
  steps: 40                # relaxed for prototype
  min_explained_variance: 0.4

# ---- 训练 ----
train:
  iterations: 300
  bf16: true
  seed: 0
  out_dir: runs/proto

# ---- 评估 (§7.f) ----
eval:
  real_eval_every: 20
  real_eval_episodes: 16
  reuse_world_model: true  # prototype: no separate real-benign model (saves ~8GB)

# ---- SFT (unused in the prototype; kept for schema completeness) ----
sft:
  n_rollout_games: 500
  keep_top_frac: 0.25
  epochs: 3
  lr: 1.0e-5
  batch_size: 8
  out_dir: runs/sft

# ---- logging ----
log:
  wandb: false
  wandb_project: consensus-attacker
  log_every: 1
