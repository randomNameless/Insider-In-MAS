[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-attacker"
version = "0.1.0"
description = "Turn-PPO malicious agent for the consensus game (v1)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["attacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
